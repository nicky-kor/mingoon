# ============================================================
# Manufacturing AI Research OS - System Configuration
# ============================================================

system:
  name: "Manufacturing AI Research OS"
  version: "0.1.0"
  timezone: "Asia/Seoul"

paths:
  database: "data/database/research_os.db"
  raw: "data/raw"
  processed: "data/processed"
  knowledge: "data/knowledge"
  reports: "data/reports"
  logs: "logs"

logging:
  level: "INFO"
  file: "logs/research_os.log"
  max_bytes: 5242880
  backup_count: 5

sources:
  arxiv:
    enabled: true
    base_url: "${ARXIV_BASE_URL:-https://export.arxiv.org/api/query}"
    categories:
      - "cs.AI"
      - "cs.LG"
      - "cs.CV"
      - "cs.RO"
      - "stat.ML"
    max_results_per_run: 25
  rss:
    # Mix of research-journal, tech-news, and company-blog sources
    # (RSSCollector doesn't distinguish -- QAAgent's grounding check
    # treats every item the same regardless of source_type, checking
    # generated claims against that item's own title+description either
    # way). All on hosts unrelated to arxiv.org, so arXiv's own rate
    # limiting never affects these. RSSCollector skips (logs a warning
    # on) any single feed that fails to fetch/parse rather than failing
    # the whole run, so a stale URL here costs only that source's items
    # for this run -- still worth confirming these resolve from wherever
    # this actually runs, since a fully sandboxed dev environment may not
    # have the same general internet access.
    enabled: true
    feeds:
      - "https://news.mit.edu/rss/topic/artificial-intelligence2"        # news
      - "https://spectrum.ieee.org/feeds/topic/artificial-intelligence.rss"  # news
      - "https://www.sciencedaily.com/rss/computers_math/artificial_intelligence.xml"  # news
      - "https://www.nature.com/natmachintell.rss"                       # journal
      - "http://rss.etnews.co.kr/Section901.xml"                         # 전자신문, 국내 기술 뉴스
      - "https://blogs.nvidia.com/blog/tag/industrial-manufacturing/feed/"  # 기업 블로그 (URL 패턴 추정 -- PC에서 확인 필요)
  github:
    enabled: true
    api_url: "https://api.github.com/search/repositories"
    topics:
      - "industrial AI"
      - "manufacturing AI"
      - "predictive maintenance"
      - "anomaly detection"
      - "fault diagnosis"
      - "digital twin"
      - "computer vision manufacturing"
      - "battery manufacturing AI"
      - "time series AI"
      - "agentic AI"
  # Korean academic societies (no RSS available -- old bulletin-board
  # sites scraped directly, see collectors/ksphm.py and collectors/kiie.py).
  ksphm:
    enabled: true
    base_url: "https://www.phm.or.kr/info/notice.php"
    pages: 1
  kiie:
    enabled: true
    base_url: "https://kiie.org/"

pipeline:
  stages:
    - collect
    - normalize
    - deduplicate
    - classify
    - extract
    - summarize
    - score
    - battery_relevance
    - transfer_analysis
    - store
    - report

privacy:
  default_level: "public"
  cloud_allowed:
    public: true
    personal: true
    restricted: false

cost_control:
  cache_llm_responses: true
  max_retries: 2
  daily_cloud_call_budget: 200
