# ============================================================
# Default agent -> model tier policy.
# This is an initial policy only; the ModelRouter may override it based on
# task_type/complexity/importance/latency/cost/privacy and, in the future,
# model benchmark results (see config/models.yaml and the evaluation lab).
# ============================================================

agent_defaults:
  DiscoveryAgent: local_fast
  ClassifierAgent: local_fast
  SummarizerAgent: local_standard
  # Reasoning-heavy agents default to local_reasoning rather than a cloud
  # tier: the Local LLM Benchmark (docs/local-llm.md) confirmed
  # qwen2.5:7b-instruct performs well on this project's actual tasks, and
  # this keeps day-to-day use free (spec section 42: don't call an
  # expensive model unnecessarily). This is a policy choice, not a fixed
  # rule — the spec always documented the initial cloud_reasoning default
  # as provisional, to be revisited once local models were benchmarked.
  # Switch these back to a cloud_* tier (and set ANTHROPIC_API_KEY) once
  # cloud quality/latency is worth the cost for your use case.
  AnalystAgent: local_reasoning
  TransferAgent: local_reasoning
  TrendAgent: local_standard
  ResearchAgent: local_reasoning
  BriefingAgent: local_reasoning

# Routing rules evaluated in order; first match wins. `default_tier` is used
# if nothing matches. Complexity/importance are 0-100 scales.
rules:
  - when: {privacy_level: "restricted"}
    prefer_local: true
  - when: {task_type: "classification", complexity: "low"}
    tier: local_fast
  - when: {task_type: "summarization", complexity: "medium"}
    tier: local_standard
  - when: {task_type: "deep_research"}
    tier: local_reasoning
  - when: {reasoning_required: true, importance_gte: 70}
    tier: local_reasoning

default_tier: local_fast

budgets:
  latency_low_ms: 3000
  latency_high_ms: 30000
  cost_low_usd: 0.01
  cost_high_usd: 0.50
