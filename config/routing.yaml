# ============================================================
# Default agent -> model tier policy.
# This is an initial policy only; the ModelRouter may override it based on
# task_type/complexity/importance/latency/cost/privacy and, in the future,
# model benchmark results (see config/models.yaml and the evaluation lab).
# ============================================================

agent_defaults:
  DiscoveryAgent: local_fast
  ClassifierAgent: local_fast
  SummarizerAgent: local_standard
  # Reasoning-heavy agents prefer cloud (better quality) whenever it's
  # actually usable. They don't need a manual "no budget, switch to
  # local" edit here: ModelGateway's circuit breaker
  # (models/circuit_breaker.py) remembers an unrecoverable cloud failure
  # (out of credit, invalid key) and automatically skips straight to the
  # local fallback for a cooldown, without repeating the same failing
  # call — see cloud_reasoning/cloud_deep_research's fallback chain in
  # config/models.yaml, which lands on local_reasoning. Once credit is
  # topped up, the very next call after the cooldown tries cloud again
  # automatically.
  AnalystAgent: cloud_reasoning
  TransferAgent: cloud_reasoning
  # TrendAgent and QAAgent have no entry here on purpose — neither calls
  # ModelGateway (agents/trend.py, agents/qa.py): TrendAgent's output is
  # DB counts/deltas, and QAAgent's job is specifically to catch an LLM
  # inventing something, so checking it with another LLM call would trade
  # one hallucination-prone step for two. Both stay deterministic.
  ResearchAgent: cloud_deep_research
  BriefingAgent: cloud_reasoning

# Routing rules evaluated in order; first match wins. `default_tier` is used
# if nothing matches. Complexity/importance are 0-100 scales.
rules:
  - when: {privacy_level: "restricted"}
    prefer_local: true
  - when: {task_type: "classification", complexity: "low"}
    tier: local_fast
  - when: {task_type: "summarization", complexity: "medium"}
    tier: local_standard
  - when: {task_type: "deep_research"}
    tier: cloud_deep_research
  - when: {reasoning_required: true, importance_gte: 70}
    tier: cloud_reasoning

default_tier: local_fast

budgets:
  latency_low_ms: 3000
  latency_high_ms: 30000
  cost_low_usd: 0.01
  cost_high_usd: 0.50
